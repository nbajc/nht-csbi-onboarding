<style>
  /* ==========================================================================
     NHT DESIGN SYSTEM V2.0 — DUAL-BACKGROUND SEMANTIC TOKENS
     ========================================================================== */
  :root[data-theme="dark"] {
    --bg-page: #0A0A0A;
    --bg-panel: #16181C;
    --bg-panel-elevated: #1E2127;
    --border-color: #2A2D35;
    --text-primary: #F5F5F5;
    --text-body: #AAAAAA;
    --text-muted: #666666;
    --accent-magenta: #D4007A;
    --accent-pink: #FF2D8A;
    --accent-crimson: #CC1A1A;
    --accent-gold: #E8A020;
    --accent-violet: #7B1FA2;
    --accent-violet-text: #D896FF;
    --accent-acid: #E8FF47;
    --accent-orange: #FF6B35;
    --accent-cyan: #47C8FF;
    --grid-dot: rgba(255, 255, 255, 0.08);
    --shadow-card: 0 12px 36px rgba(0, 0, 0, 0.72);
    --logo-nexus: #F5F5F5;
    --logo-sub: #AAAAAA;
    --on-accent: #0A0A0A;
    --sim-color: var(--accent-acid);
    --sim-glow: rgba(232, 255, 71, 0.28);
    --owner-nht: var(--accent-acid);
    --owner-nht-bg: rgba(232, 255, 71, 0.1);
  }
  :root[data-theme="light"] {
    --bg-page: #FAFAFB;
    --bg-panel: #F2F2F4;
    --bg-panel-elevated: #FFFFFF;
    --border-color: #E2E2E6;
    --text-primary: #101012;
    --text-body: #55555C;
    --text-muted: #8A8A93;
    --accent-magenta: #C2007A;
    --accent-pink: #E01A78;
    --accent-crimson: #B31A1A;
    --accent-gold: #B8860B;
    --accent-violet: #6B1B92;
    --accent-violet-text: #6B1B92;
    --accent-acid: #7BA500;
    --accent-orange: #D94E1F;
    --accent-cyan: #0A7BA5;
    --grid-dot: rgba(16, 16, 18, 0.09);
    --shadow-card: 0 10px 28px rgba(16, 16, 18, 0.08);
    --logo-nexus: #000000;
    --logo-sub: #000000;
    --on-accent: #FFFFFF;
    --sim-color: var(--accent-magenta);
    --sim-glow: rgba(194, 0, 122, 0.24);
    --owner-nht: var(--accent-violet);
    --owner-nht-bg: rgba(107, 27, 146, 0.1);
  }

  /* ==========================================================================
     FLUID SCALE — clamp(min, preferred, max) so every size adapts per device
     ========================================================================== */
  :root {
    --fs-label: clamp(8.5px, 0.48rem + 0.12vw, 10px);     /* Space Mono UI labels (8–11px) */
    --fs-small: clamp(11px, 0.64rem + 0.15vw, 12.5px);
    --fs-body: clamp(13px, 0.76rem + 0.15vw, 14px);       /* DM Sans body (12–14px) */
    --fs-lead: clamp(13.5px, 0.8rem + 0.2vw, 15px);
    --fs-h3: clamp(20px, 1rem + 0.6vw, 26px);             /* Bebas section headers */
    --fs-h2: clamp(24px, 1.1rem + 1vw, 32px);
    --fs-title: clamp(20px, 0.9rem + 1.1vw, 30px);
    --fs-word: clamp(30px, 1.1rem + 2.1vw, 52px);         /* Wordmark (spec 52px) */
    --fs-sub: clamp(8.5px, 0.35rem + 0.38vw, 14px);       /* TECHNOLOGIES INC (spec 14px) */
    --pad: clamp(12px, 0.45rem + 1vw, 24px);
    --gap: clamp(10px, 0.35rem + 0.6vw, 16px);
    --radius: clamp(4px, 0.2rem + 0.2vw, 8px);
    --logo-lg: clamp(56px, 7.5vw, 120px);                 /* Intricate: 120px desktop, compact on mobile */
    --logo-sm: 48px;                                      /* Reduced footer: min 48px */
    --sidebar-w: clamp(380px, 30vw, 520px);
    --tap: clamp(34px, 2rem + 0.4vw, 40px);               /* comfortable touch targets */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg-page);
    color: var(--text-body);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: var(--fs-body);
    line-height: 1.5;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  button, input, select, textarea { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 2px; }

  .mono { font-family: 'Space Mono', monospace; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; }

  /* App shell: fixed-height workspace on desktop, natural scrolling on compact devices */
  .app { display: flex; flex-direction: column; min-height: 100dvh; }
  .app.desktop { height: 100dvh; overflow: hidden; }

  /* ==========================================================================
     HEADER
     ========================================================================== */
  header {
    padding: clamp(8px, 0.6vw, 10px) var(--pad);
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border-color);
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-areas: "brand title actions";
    align-items: center;
    gap: var(--gap) clamp(12px, 2vw, 28px);
    flex-shrink: 0;
    z-index: 30;
  }
  .brand { grid-area: brand; display: flex; align-items: center; gap: clamp(10px, 1vw, 16px); user-select: none; min-width: 0; }
  .logo-lg { width: var(--logo-lg); height: var(--logo-lg); object-fit: contain; flex-shrink: 0; }
  .brand-lockup { display: inline-flex; flex-direction: column; }
  .brand-wordmark { font-family: 'Bebas Neue', sans-serif; font-size: var(--fs-word); line-height: 1; letter-spacing: 0.02em; display: flex; gap: 0.2em; white-space: nowrap; }
  .brand-nexus { color: var(--logo-nexus); }
  .brand-hestia { color: var(--accent-magenta); }
  .brand-subline { font-family: 'Space Mono', monospace; font-size: var(--fs-sub); font-weight: 700; color: var(--logo-sub); display: flex; justify-content: space-between; line-height: 1.2; }
  .brand-tagline { margin-top: 6px; font-size: var(--fs-small); color: var(--text-body); }

  .title-block { grid-area: title; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
  .kicker { font-size: var(--fs-label); color: var(--accent-magenta); }
  .main-title { font-family: 'Bebas Neue', sans-serif; font-size: var(--fs-title); letter-spacing: 0.05em; color: var(--text-primary); line-height: 1.1; }
  .client-line { font-family: 'Space Mono', monospace; font-size: var(--fs-label); color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .client-line strong { color: var(--accent-cyan); }

  .actions { grid-area: actions; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .btn-row-h { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  .btn {
    min-height: var(--tap);
    background: var(--bg-page);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    font-family: 'Space Mono', monospace;
    font-size: var(--fs-label);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0 clamp(10px, 1vw, 14px);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent-magenta); color: var(--accent-pink); }
  .btn.primary { border-color: var(--sim-color); color: var(--sim-color); }
  .btn.primary.on, .btn.primary.solid { background: var(--sim-color); color: var(--on-accent); }
  .btn.danger:hover { border-color: var(--accent-crimson); color: var(--accent-crimson); }
  .btn.small { min-height: 26px; padding: 0 8px; font-size: 8.5px; }

  .progress { display: flex; align-items: center; gap: 10px; }
  .progress .num { font-family: 'Space Mono', monospace; font-weight: 700; color: var(--accent-acid); font-size: var(--fs-small); }
  :root[data-theme="light"] .progress .num { color: var(--accent-magenta); }
  .bar { width: clamp(90px, 10vw, 160px); height: 6px; background: var(--bg-page); border: 1px solid var(--border-color); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-magenta), var(--accent-pink)); transition: width 0.3s ease; }

  /* ==========================================================================
     DESKTOP WORKSPACE — CANVAS + SIDEBAR
     ========================================================================== */
  .workspace { display: flex; flex: 1; min-height: 0; overflow: hidden; }

  .viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    background-image: radial-gradient(var(--grid-dot) 1.25px, transparent 1.25px);
    background-size: 24px 24px;
  }
  .viewport.panning { cursor: grabbing; }
  .world { position: absolute; top: 0; left: 0; width: 2480px; height: 1200px; transform-origin: 0 0; }

  svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 1; }
  .e-bg { fill: none; stroke: var(--border-color); stroke-width: 2.5; }
  .e-anim { fill: none; stroke: var(--accent-magenta); stroke-width: 2.5; stroke-dasharray: 8 8; animation: dashFlow 1.4s linear infinite; opacity: 0.75; }
  .e-pulse { fill: none; stroke: var(--sim-color); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 24 260; animation: pulseTravel 2.2s linear infinite; }
  @keyframes dashFlow { to { stroke-dashoffset: -32; } }
  @keyframes pulseTravel { 0% { stroke-dashoffset: 284; } 100% { stroke-dashoffset: 0; } }

  .overview {
    display: flex; align-items: center; gap: 22px;
    padding: 16px 22px;
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-left: 3px solid var(--accent-magenta);
    border-radius: 8px;
    box-shadow: var(--shadow-card);
  }
  .world .overview { position: absolute; left: 40px; top: 24px; width: 2370px; z-index: 5; }
  .overview .ov-label { font-size: 10px; color: var(--accent-magenta); white-space: nowrap; }
  .overview .ov-text { font-size: 15px; max-width: 1500px; }
  .overview .ov-text strong { color: var(--text-primary); font-weight: 500; }
  .overview .ov-count { margin-left: auto; font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--text-primary); letter-spacing: 0.05em; white-space: nowrap; }
  .overview .ov-count span { color: var(--accent-magenta); }

  /* Canvas step nodes (world units — scaled by zoom, so fixed px is intentional) */
  .step-node {
    position: absolute;
    width: 410px;
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    box-shadow: var(--shadow-card);
    z-index: 10;
    user-select: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
    cursor: pointer;
    font-size: 13px;
  }
  .step-node:hover { border-color: var(--accent-pink); }
  .step-node.selected { border-color: var(--accent-magenta); box-shadow: 0 0 0 2px var(--accent-magenta), var(--shadow-card); }
  .step-node.sim, .step-section.sim { border-color: var(--sim-color); box-shadow: 0 0 28px var(--sim-glow); }

  .node-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; cursor: move; }
  .node-horizon { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-muted); letter-spacing: 0.1em; }
  .node-body { padding: 15px 16px; display: flex; flex-direction: column; gap: 10px; }
  .node-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.04em; color: var(--text-primary); line-height: 1.05; }
  .node-title small { display: block; font-size: 15px; color: var(--accent-magenta); letter-spacing: 0.08em; }
  .node-goal { font-size: 12.5px; }
  .node-footer { padding: 10px 16px; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: 'Space Mono', monospace; font-size: 9.5px; color: var(--text-muted); background: rgba(0, 0, 0, 0.12); border-radius: 0 0 8px 8px; }
  .node-footer .bar { width: 80px; height: 5px; }
  .node-footer .count { color: var(--text-body); font-weight: 700; }
  .link-btn { background: none; border: none; color: var(--accent-magenta); font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em; }

  .tag { font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
  .t1 { background: rgba(71, 200, 255, 0.15); color: var(--accent-cyan); border: 1px solid rgba(71, 200, 255, 0.35); }
  .t2 { background: rgba(212, 0, 122, 0.16); color: var(--accent-pink); border: 1px solid rgba(212, 0, 122, 0.4); }
  .t3 { background: rgba(232, 160, 32, 0.16); color: var(--accent-gold); border: 1px solid rgba(232, 160, 32, 0.4); }
  .t4 { background: rgba(123, 31, 162, 0.2); color: var(--accent-violet-text); border: 1px solid rgba(123, 31, 162, 0.45); }
  .t5 { background: rgba(255, 107, 53, 0.16); color: var(--accent-orange); border: 1px solid rgba(255, 107, 53, 0.45); }

  .item-card { background: var(--bg-panel-elevated); border: 1px solid var(--border-color); border-radius: 5px; padding: 9px 11px; }
  .item-card.s2 { border-left: 3px solid var(--accent-acid); }
  .item-card.s1 { border-left: 3px solid var(--accent-gold); }
  .item-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
  .item-num { font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; color: var(--accent-magenta); text-transform: uppercase; }
  .item-title { font-weight: 700; color: var(--text-primary); font-size: 12.5px; }
  .item-desc { font-size: 11.5px; line-height: 1.38; }
  .addon { display: inline-block; margin-top: 6px; font-family: 'Space Mono', monospace; font-size: 8.5px; font-weight: 700; color: var(--accent-gold); border: 1px dashed var(--accent-gold); padding: 2px 7px; border-radius: 3px; }

  .bucket-row, .check-row { display: flex; align-items: center; gap: 9px; padding: 6px 9px; background: var(--bg-panel-elevated); border: 1px solid var(--border-color); border-radius: 4px; font-size: 11.5px; color: var(--text-primary); }
  .check-row { display: grid; grid-template-columns: 26px 1fr auto 10px; gap: 8px; padding: 7px 9px; }
  .check-row .cnum { font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; color: var(--accent-orange); }
  .bdot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .bnum { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--text-muted); font-weight: 700; }
  .mini { font-family: 'Space Mono', monospace; font-size: var(--fs-label); font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); text-transform: uppercase; }
  .stack { display: flex; flex-direction: column; gap: 5px; }

  .owner { font-family: 'Space Mono', monospace; font-size: 8.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
  .owner.client { color: var(--accent-cyan); background: rgba(71, 200, 255, 0.1); }
  .owner.nht { color: var(--owner-nht); background: var(--owner-nht-bg); }
  .owner.joint { color: var(--accent-orange); background: rgba(255, 107, 53, 0.12); }

  .sdot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--text-muted); flex-shrink: 0; display: inline-block; }
  .sdot.s1 { border-color: var(--accent-gold); background: rgba(232, 160, 32, 0.35); }
  .sdot.s2 { border-color: var(--accent-acid); background: var(--accent-acid); }

  .gate { position: absolute; transform: translate(-50%, -50%); background: var(--bg-panel-elevated); border: 1px solid var(--accent-gold); color: var(--accent-gold); font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; z-index: 12; pointer-events: none; box-shadow: var(--shadow-card); white-space: nowrap; }
  .gate.cleared { border-color: var(--accent-acid); color: var(--accent-acid); }

  .hud, .legend { position: absolute; bottom: 18px; display: flex; align-items: center; gap: 8px; background: var(--bg-panel); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; z-index: 20; box-shadow: var(--shadow-card); font-family: 'Space Mono', monospace; font-size: 10px; }
  .hud { left: 22px; }
  .legend { right: 22px; gap: 12px; }
  .legend .l { display: flex; align-items: center; gap: 6px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; }
  .hud-btn { background: var(--bg-page); border: 1px solid var(--border-color); color: var(--text-primary); min-width: 26px; height: 26px; padding: 0 6px; border-radius: 4px; cursor: pointer; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px; }
  .hud-btn:hover { border-color: var(--accent-magenta); color: var(--accent-magenta); }
  @media (max-width: 1440px) { .hud-hint { display: none; } }

  .sidebar { width: var(--sidebar-w); background: var(--bg-panel); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; min-height: 0; }
  .sidebar .panel { flex: 1; overflow-y: auto; }

  /* ==========================================================================
     TABS + PANELS (shared by desktop sidebar and compact layout)
     ========================================================================== */
  .tabs { display: flex; border-bottom: 1px solid var(--border-color); background: var(--bg-page); }
  .tab { flex: 1; min-height: var(--tap); padding: 0 4px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); font-family: 'Space Mono', monospace; font-size: var(--fs-label); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; transition: all 0.2s ease; }
  .tab:hover { color: var(--text-primary); }
  .tab.active { color: var(--accent-magenta); border-bottom-color: var(--accent-magenta); background: var(--bg-panel); }

  .panel { padding: var(--pad); display: flex; flex-direction: column; gap: var(--gap); }
  .section-kicker { font-family: 'Space Mono', monospace; font-size: var(--fs-label); font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-magenta); margin-bottom: 4px; }
  .h2 { font-family: 'Bebas Neue', sans-serif; font-size: var(--fs-h2); letter-spacing: 0.04em; color: var(--text-primary); line-height: 1.05; }
  .h2 small { display: block; font-size: 0.55em; color: var(--accent-magenta); letter-spacing: 0.08em; margin-top: 2px; }
  .lead { margin-top: 6px; font-size: var(--fs-lead); }

  .block { background: var(--bg-page); border: 1px solid var(--border-color); border-radius: var(--radius); padding: clamp(10px, 1vw, 14px); display: flex; flex-direction: column; gap: 10px; }
  .block-title { font-family: 'Space Mono', monospace; font-size: var(--fs-label); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-primary); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .block-title .sub { color: var(--text-muted); }

  .detail { padding: clamp(9px, 0.9vw, 12px); background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 4px; display: flex; flex-direction: column; gap: 4px; }
  .detail .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .detail .d-title { font-weight: 700; color: var(--text-primary); font-size: var(--fs-body); }
  .detail .d-text { font-size: var(--fs-body); }
  .detail .d-need { font-family: 'Space Mono', monospace; font-size: var(--fs-label); color: var(--accent-cyan); flex: 1 1 200px; }

  .status { min-height: 28px; font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 0 10px; border-radius: 99px; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-panel-elevated); color: var(--text-muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .status.s1 { border-color: var(--accent-gold); color: var(--accent-gold); }
  .status.s2 { border-color: var(--accent-acid); color: var(--accent-acid); }
  .status:hover { border-color: var(--accent-magenta); }

  .label { font-family: 'Space Mono', monospace; font-size: var(--fs-label); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-primary); margin-bottom: 4px; display: block; }
  .hint { font-size: var(--fs-small); color: var(--text-muted); margin: -2px 0 5px; display: block; }
  .input { width: 100%; min-height: var(--tap); background: var(--bg-panel-elevated); border: 1px solid var(--border-color); border-radius: 4px; padding: 8px 10px; color: var(--text-primary); font-size: max(16px, var(--fs-body)); } /* 16px+ stops iOS zoom-on-focus */
  @media (min-width: 1101px) { .input { font-size: var(--fs-body); } }
  textarea.input { min-height: 68px; resize: vertical; }
  .input:focus { outline: none; border-color: var(--accent-magenta); }
  .input::placeholder { color: var(--text-muted); }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }

  .chip { display: flex; align-items: flex-start; gap: 10px; padding: 9px 10px; min-height: var(--tap); background: var(--bg-panel); border: 1px solid var(--border-color); border-left: 3px solid var(--accent-cyan); border-radius: 4px; cursor: pointer; font-size: var(--fs-body); color: var(--text-primary); }
  .chip.gold { border-left-color: var(--accent-gold); }
  .chip input { accent-color: var(--accent-magenta); margin-top: 3px; width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 4px; padding: clamp(8px, 0.8vw, 10px); }
  .stat .v { font-family: 'Bebas Neue', sans-serif; font-size: clamp(26px, 1.2rem + 1vw, 34px); line-height: 1; color: var(--text-primary); }
  .stat .k { font-family: 'Space Mono', monospace; font-size: var(--fs-label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
  .stat.done .v { color: var(--accent-acid); }
  .stat.prog .v { color: var(--accent-gold); }

  .so-group { font-family: 'Space Mono', monospace; font-size: var(--fs-label); font-weight: 700; letter-spacing: 0.14em; color: var(--accent-magenta); text-transform: uppercase; padding-top: 6px; }
  .so-row { display: grid; grid-template-columns: clamp(56px, 4.5vw, 68px) 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border-color); }
  .so-step { font-family: 'Space Mono', monospace; font-size: var(--fs-label); font-weight: 700; color: var(--text-primary); }
  .so-need { font-size: var(--fs-body); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .so-row.s2 .so-need > span:first-child { text-decoration: line-through; color: var(--text-muted); }

  .ref-note { font-size: var(--fs-small); color: var(--text-muted); font-style: italic; }
  .meter { display: grid; grid-template-columns: minmax(110px, 40%) 1fr 34px; align-items: center; gap: 8px; font-size: var(--fs-small); }
  .meter-track { height: 8px; background: var(--bg-panel-elevated); border: 1px solid var(--border-color); border-radius: 2px; overflow: hidden; }
  .meter-track > span { display: block; height: 100%; }
  .meter .mv { font-family: 'Space Mono', monospace; font-size: var(--fs-label); font-weight: 700; color: var(--text-primary); text-align: right; }
  .era { display: grid; grid-template-columns: minmax(100px, 35%) 1fr; gap: 8px; font-size: var(--fs-small); }
  .era .mono { font-size: var(--fs-label); color: var(--text-primary); letter-spacing: 0.08em; }

  pre.out { background: var(--bg-panel-elevated); border: 1px solid var(--border-color); border-radius: 5px; padding: 11px; font-family: 'Courier New', monospace; font-size: clamp(10px, 0.6rem + 0.1vw, 11px); color: var(--accent-cyan); white-space: pre-wrap; word-break: break-word; line-height: 1.45; max-height: clamp(240px, 40vh, 360px); overflow: auto; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btns .btn { flex: 1 1 auto; }

  /* ==========================================================================
     COMPACT LAYOUT (tablet & phone, ≤ 1100px)
     ========================================================================== */
  .app.compact header {
    grid-template-columns: 1fr auto;
    grid-template-areas: "brand actions" "title title";
  }
  .app.compact .title-block { align-items: flex-start; text-align: left; padding-top: 4px; border-top: 1px solid var(--border-color); }
  .app.compact .brand-tagline { display: none; }
  .compact-tabs { position: sticky; top: 0; z-index: 40; }
  .compact-main { flex: 1; width: 100%; max-width: 860px; margin: 0 auto; }
  .compact-main .overview { flex-direction: column; align-items: flex-start; gap: 6px; padding: var(--pad); }
  .compact-main .overview .ov-text { font-size: var(--fs-lead); }
  .compact-main .overview .ov-count { margin-left: 0; font-size: var(--fs-h3); }

  .step-section { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: var(--radius); scroll-margin-top: calc(var(--tap) + 12px); transition: border-color 0.25s, box-shadow 0.25s; }
  .step-section > .sec-head { padding: 10px var(--pad); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .step-section > .panel { padding: var(--pad); }
  .gate-link { display: flex; flex-direction: column; align-items: center; gap: 0; margin: -6px 0; }
  .gate-link::before, .gate-link::after { content: ""; width: 2px; height: 14px; background: repeating-linear-gradient(var(--accent-magenta) 0 4px, transparent 4px 8px); }
  .gate-link .gate { position: static; transform: none; }

  @media (max-width: 560px) {
    .app.compact header { grid-template-columns: 1fr; grid-template-areas: "brand" "actions" "title"; }
    .app.compact .actions { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .app.compact .actions .btn-row-h { justify-content: flex-start; }
    .app.compact .actions .progress .mono { display: none; }
    .stats .stat .k { letter-spacing: 0.06em; }
    footer .f-hide { display: none; }
  }

  /* ==========================================================================
     FOOTER — Reduced logo
     ========================================================================== */
  footer { flex-shrink: 0; min-height: 60px; padding: 6px var(--pad); padding-bottom: max(6px, env(safe-area-inset-bottom)); background: var(--bg-panel); border-top: 1px solid var(--border-color); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: var(--fs-small); color: var(--text-muted); }
  .logo-sm { width: var(--logo-sm); height: var(--logo-sm); object-fit: contain; }
  footer .f-brand { font-family: 'Space Mono', monospace; font-weight: 700; font-size: var(--fs-label); letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-primary); }
  footer .f-right { margin-left: auto; font-family: 'Space Mono', monospace; font-size: var(--fs-label); letter-spacing: 0.12em; text-transform: uppercase; }
  @media (max-width: 900px) { footer .f-sep, footer .f-tag { display: none; } }

  .toast { position: fixed; bottom: 76px; right: var(--pad); left: auto; max-width: calc(100vw - 2 * var(--pad)); background: var(--bg-panel-elevated); border: 1px solid var(--accent-magenta); color: var(--text-primary); font-family: 'Space Mono', monospace; font-size: var(--fs-label); letter-spacing: 0.1em; text-transform: uppercase; padding: 9px 14px; border-radius: 4px; box-shadow: var(--shadow-card); opacity: 0; transform: translateY(8px); transition: all 0.2s ease; pointer-events: none; z-index: 100; }
  .toast.show { opacity: 1; transform: none; }

  .boot-msg { padding: 40px var(--pad); max-width: 640px; margin: 0 auto; font-size: 15px; }
  .boot-msg strong { color: var(--text-primary); }

  .print-sheet { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .e-anim { animation: none; }
    .e-pulse { display: none; }
    * { transition: none !important; scroll-behavior: auto !important; }
  }

  /* ==========================================================================
     PRINT — one-page setup summary with signature blocks
     ========================================================================== */
  @media print {
    @page { margin: 14mm; }
    html, body { background: #FFFFFF !important; color: #101012 !important; }
    .app { display: block !important; height: auto !important; overflow: visible !important; }
    .app > *:not(.print-sheet), .toast { display: none !important; }
    .print-sheet { display: block !important; font-size: 10.5pt; color: #101012; }
    .print-sheet .p-head { display: flex; align-items: center; gap: 14px; border-bottom: 2px solid #C2007A; padding-bottom: 10px; margin-bottom: 14px; }
    .print-sheet .p-head img { width: 120px; height: 120px; object-fit: contain; }
    .print-sheet .p-word { font-family: 'Bebas Neue', sans-serif; font-size: 40pt; line-height: 1; color: #000; }
    .print-sheet .p-word span { color: #C2007A; }
    .print-sheet .p-sub { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 9pt; display: flex; justify-content: space-between; color: #000; }
    .print-sheet h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 22pt; letter-spacing: 0.04em; }
    .print-sheet h2 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 15pt; letter-spacing: 0.05em; color: #C2007A; margin: 14px 0 4px; break-after: avoid; }
    .print-sheet .p-meta { font-family: 'Space Mono', monospace; font-size: 8pt; color: #55555C; text-transform: uppercase; letter-spacing: 0.1em; }
    .print-sheet dl { display: grid; grid-template-columns: 200px 1fr; gap: 3px 12px; }
    .print-sheet dt { font-weight: 700; }
    .print-sheet dd { color: #55555C; white-space: pre-wrap; }
    .print-sheet table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
    .print-sheet th, .print-sheet td { border: 1px solid #E2E2E6; padding: 4px 6px; text-align: left; }
    .print-sheet th { background: #F2F2F4; font-family: 'Space Mono', monospace; font-size: 7.5pt; text-transform: uppercase; letter-spacing: 0.1em; }
    .print-sheet .sig { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 10px; break-inside: avoid; }
    .print-sheet .sig > div { border: 1px solid #E2E2E6; padding: 10px; }
    .print-sheet .sig p { margin-top: 12px; }
    .print-sheet .p-foot { margin-top: 16px; display: flex; align-items: center; gap: 10px; font-size: 8pt; color: #8A8A93; border-top: 1px solid #E2E2E6; padding-top: 8px; }
    .print-sheet .p-foot img { width: 48px; height: 48px; object-fit: contain; }
  }
</style>

];

const READY_CONNECTORS = ['Spreadsheets', 'PDFs', 'Scanned paper', 'Emails', 'Audio / video files', 'Cloud drives'];

  eras: [['c. 1994–2000', 'Paper & fax'], ['c. 2001–2008', 'Early digital'], ['c. 2009–2015', 'Digital & early programmatic'], ['c. 2016–2021', 'Programmatic, social & streaming'], ['c. 2022–present', 'CTV, retail media & AI']]

const DEFAULT_POSITIONS = [{ x: 40, y: 150 }, { x: 530, y: 290 }, { x: 1020, y: 150 }, { x: 1510, y: 290 }, { x: 2000, y: 150 }];
const STORE_KEY = 'nht-getting-started-v1';

function defaultState() {
  return {
    theme: 'dark',
    status: Array(15).fill(0),
    positions: DEFAULT_POSITIONS.map(p => ({ ...p })),
    form: {
      orgName: CLIENT, currentStorage: '', legacyMedia: '', rescueService: true,
      alreadySaved: '', day1Files: '', phase2Files: '',
      adminName: '', adminEmail: '', accessRules: '',
      connectors: Object.fromEntries(READY_CONNECTORS.map(c => [c, true])), customConnectors: '',
      transferMethod: TRANSFER_OPTIONS[0], privacyRules: '',
      duplicateRule: 'The newest, approved version of a file is the official copy.',
      softwareLogins: '', sampleFiles: '', keyPeople: '',
      clientLeadName: '', clientLeadTitle: '', clientLeadDate: '',
      nhtLeadName: '', nhtLeadTitle: '', nhtLeadDate: ''
    }
  };
}

function loadState() {
  const base = defaultState();
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (!saved) return base;
    const form = { ...base.form, ...(saved.form || {}), connectors: { ...base.form.connectors, ...((saved.form || {}).connectors || {}) } };
    if (!String(form.orgName || '').trim()) form.orgName = CLIENT;
    return {
      theme: saved.theme === 'light' ? 'light' : 'dark',
      status: Array.isArray(saved.status) && saved.status.length === 15 ? saved.status.map(n => (n >= 0 && n <= 2 ? n : 0)) : base.status,
      positions: Array.isArray(saved.positions) && saved.positions.length === 5 ? saved.positions : base.positions,
      form
    };
  } catch (e) { return base; }
}

function reducer(s, a) {
  switch (a.type) {
    case 'field': return { ...s, form: { ...s.form, [a.key]: a.value } };
    case 'connector': return { ...s, form: { ...s.form, connectors: { ...s.form.connectors, [a.key]: a.value } } };
    case 'cycle': { const st = s.status.slice(); st[a.row] = (st[a.row] + 1) % 3; return { ...s, status: st }; }
    case 'move': { const p = s.positions.slice(); p[a.idx] = { x: a.x, y: a.y }; return { ...s, positions: p }; }
    case 'resetLayout': return { ...s, positions: DEFAULT_POSITIONS.map(p => ({ ...p })) };
    case 'theme': return { ...s, theme: s.theme === 'dark' ? 'light' : 'dark' };
    case 'resetAll': { const d = defaultState(); return { ...d, theme: s.theme, positions: s.positions }; }
    default: return s;
  }
}

const or = (v, fb) => (v && String(v).trim() ? String(v).trim() : fb);
const clientName = f => or(f.orgName, CLIENT);

function briefMarkdown(state) {

## STEP 4: CONNECTING YOUR SOFTWARE TOOLS
- 7. Ready-to-Use Connectors ${st(7)}: ${conns.length ? conns.join(', ') : 'None selected'}
- 8. Custom Connectors Needed ASAP ${st(8)}: ${or(f.customConnectors, '[None identified]')}

## STEP 5: 6 QUICK SAFETY CHECKS

- Check 3. Handling Duplicate Files ${st(11)}: ${or(f.duplicateRule, '[Pending]')}
- Check 4. Software Permissions (read-only) ${st(12)}: ${or(f.softwareLogins, '[Pending]')}
- Check 5. Sample Test Files ${st(13)}: ${or(f.sampleFiles, '[Pending]')}
  Key People to Record First: ${or(f.keyPeople, '[Pending]')}
- Check 6. Final Sign-Off ${st(14)}

## EXECUTIVE SIGN-OFF & AUTHORIZATION
Client Lead: ${or(f.clientLeadName, '________________')} — ${or(f.clientLeadTitle, '________________')} — ${or(f.clientLeadDate, 'Date ________')}
Nexus Hestia Lead: ${or(f.nhtLeadName, '________________')} — ${or(f.nhtLeadTitle, '________________')} — ${or(f.nhtLeadDate, 'Date ________')}`;
}

function exportObject(state) {
  return {
    document: 'Nexus Hestia — Guide to Getting Started (Client Onboarding Checklist)',
    client: clientName(state.form),
    exportedAt: new Date().toISOString(),
    intake: state.form,
    signOff: SIGNOFF.map((r, i) => ({ ...r, status: STATUS_LABELS[state.status[i]] }))
  };
}

function copyText(txt, done) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); done();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
  else fallback();
}

function downloadJSON(state) {
  const blob = new Blob([JSON.stringify(exportObject(state), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const slug = clientName(state.form).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'client';
  const a = document.createElement('a');
  a.href = url; a.download = `nht-getting-started-${slug}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

<script>
/* ==========================================================================
   REACT APPLICATION (React 18 + htm)
   ========================================================================== */
(function () {
  const root = document.getElementById('root');
  if (!window.React || !window.ReactDOM || !window.htm) {
    root.innerHTML = '<div class="boot-msg"><strong>This page needs an internet connection to load.</strong><br>Please reconnect and refresh.</div>';
    return;
  }

  const { useState, useEffect, useLayoutEffect, useRef, useReducer, useCallback, useMemo } = React;
  const html = htm.bind(React.createElement);
  const clampN = (v, a, b) => Math.min(b, Math.max(a, v));

  function useMedia(query) {
    const [m, setM] = useState(() => window.matchMedia(query).matches);
    useEffect(() => {
      const mq = window.matchMedia(query);
      const on = () => setM(mq.matches);
      mq.addEventListener('change', on);
      return () => mq.removeEventListener('change', on);
    }, [query]);
    return m;
  }

  /* ---------- Small building blocks ---------- */

  const Dot = ({ s }) => html`<span className=${'sdot s' + s} title=${STATUS_LABELS[s]}></span>`;
  const Bar = ({ pct }) => html`<div className="bar"><span style=${{ width: pct + '%' }}></span></div>`;

  function StatusBtn({ row, state, dispatch }) {
    const s = state.status[row];
    return html`<button type="button" className=${'status s' + s}
      aria-label=${`${SIGNOFF[row].step} status: ${STATUS_LABELS[s]}. Activate to change.`}
      onClick=${() => dispatch({ type: 'cycle', row })}><${Dot} s=${s} />${STATUS_LABELS[s]}</button>`;
  }

  function Wordmark() {
    return html`<div className="brand-lockup">
      <div className="brand-wordmark"><span className="brand-nexus">NEXUS</span><span className="brand-hestia">HESTIA</span></div>
      <div className="brand-subline" aria-label="Technologies Inc">
        ${'TECHNOLOGIES INC'.split('').map((c, i) => html`<span key=${i}>${c === ' ' ? ' ' : c}</span>`)}
      </div>
      <div className="brand-tagline">Sovereign AI Data Infrastructure & Spatial Analytics</div>
    </div>`;
  }

  function OverviewCard({ innerRef }) {
    return html`<div className="overview" ref=${innerRef}>
      <span className="ov-label mono">Overview</span>
      <p className="ov-text">At Nexus Hestia, we build a <strong>private, locked digital vault for ${CLIENT}'s knowledge.</strong> It keeps your files, history, and trade secrets completely safe from public AI tools while turning decades of scattered records into a smart, searchable system. Before we build your vault, we go through 5 simple steps together.</p>
      <span className="ov-count"><span>5</span> Steps · <span>15</span> Sign-Offs</span>
    </div>`;
  }

  /* ---------- Header ---------- */
  function Header({ state, dispatch, simOn, setSimOn }) {

      <div className="brand">

      </div>

        <span className="kicker mono">Plain-Language Client Onboarding Guide</span>

            ${state.theme === 'dark' ? '☀ Light' : '☾ Dark'}
          </button>
        </div>
        <div className="progress">
          <span className="mono" style=${{ fontSize: 'var(--fs-label)' }}>Sign-Off</span>
          <${Bar} pct=${(d / 15) * 100} />
          <span className="num">${d} / 15</span>
        </div>
      </div>
    </header>`;
  }

  /* ---------- Canvas node ---------- */
  function StepNode({ si, state, selected, sim, onSelect, nodeRef }) {
    const s = STEPS[si];
    const done = s.items.filter(it => state.status[it.row] === 2).length;
    const pos = state.positions[si];
    return html`<div ref=${nodeRef} className=${'step-node' + (selected ? ' selected' : '') + (sim ? ' sim' : '')}
        data-stage=${si} tabIndex="0" role="button" aria-label=${`Step ${si + 1}: ${s.title}`}
        style=${{ left: pos.x + 'px', top: pos.y + 'px' }}
        onKeyDown=${e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === e.currentTarget) { e.preventDefault(); onSelect(si); } }}>
      <div className="node-header">
        <span className=${'tag ' + s.tagClass}>${s.tag}</span>
        <span className="node-horizon">${s.horizon}</span>
      </div>
      <div className="node-body">
        <div className="node-title">${s.title}<small>${s.subtitle}</small></div>
        <div className="node-goal">${s.intro}</div>
        ${s.buckets && html`
          <div className="mini">The 5 Buckets</div>
          <div className="stack">${BUCKETS.map((b, i) => html`
            <div className="bucket-row" key=${i}><span className="bdot" style=${{ background: b.color }}></span><span className="bnum">B${i + 1}</span>${b.name}</div>`)}
          </div>
          <div className="mini">What Moves In First</div>`}
        ${s.checks
          ? s.items.map(it => html`<div className="check-row" key=${it.code}>
              <span className="cnum">${it.code}</span><span>${it.label}</span>
              <${Owner} who=${it.who}>${it.owner}<//><${Dot} s=${state.status[it.row]} />
            </div>`)
          : s.items.map(it => { const st = state.status[it.row]; return html`
            <div className=${'item-card s' + st} key=${it.code}>
              <div className="item-head">
                <span className="item-num">Item ${it.code}</span>
                <span style=${{ display: 'flex', alignItems: 'center', gap: '6px' }}><${Owner} who=${it.who}>${it.owner}<//><${Dot} s=${st} /></span>
              </div>
              <div className="item-title">${it.label}</div>
              <div className="item-desc">${SIGNOFF[it.row].need}</div>
              ${it.addon && html`<div className="addon">${it.addon}</div>`}
            </div>`; })}
      </div>
      <div className="node-footer">
        <span className="count">${done} / ${s.items.length} DONE</span>
        <${Bar} pct=${(done / s.items.length) * 100} />
        <button type="button" className="link-btn" onClick=${() => onSelect(si)}>Open Step →</button>
      </div>
    </div>`;
  }

  /* ---------- Desktop spatial canvas (pan / zoom / drag) ---------- */
  function Canvas({ state, dispatch, selected, onSelect, simStep }) {
    const vpRef = useRef(null), bannerRef = useRef(null), nodeRefs = useRef([]);
    const [view, setView] = useState({ s: 0.6, x: 20, y: 20 });
    const viewRef = useRef(view); viewRef.current = view;
    const [geom, setGeom] = useState({ key: '', edges: [] });
    const [panning, setPanning] = useState(false);
    const dragRef = useRef(null);

    useLayoutEffect(() => {
      const ns = nodeRefs.current;
      if (ns.length < 5 || ns.some(n => !n)) return;
      const edges = [];
      for (let i = 0; i < 4; i++) {
        const a = ns[i], b = ns[i + 1];
        const x1 = a.offsetLeft + a.offsetWidth, y1 = a.offsetTop + a.offsetHeight / 2;
        const x2 = b.offsetLeft, y2 = b.offsetTop + b.offsetHeight / 2;
        const dx = Math.max(60, Math.abs(x2 - x1) * 0.5);
        edges.push({ d: `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`, gx: (x1 + x2) / 2, gy: (y1 + y2) / 2 });
      }
      const key = JSON.stringify(edges);
      if (key !== geom.key) setGeom({ key, edges });
    });

    const fit = useCallback(() => {
      const vp = vpRef.current;
      const els = [...nodeRefs.current, bannerRef.current].filter(Boolean);
      if (!vp || !els.length) return;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      els.forEach(n => {
        minX = Math.min(minX, n.offsetLeft); minY = Math.min(minY, n.offsetTop);
        maxX = Math.max(maxX, n.offsetLeft + n.offsetWidth); maxY = Math.max(maxY, n.offsetTop + n.offsetHeight);
      });
      const vw = vp.clientWidth, vh = vp.clientHeight - 60;
      const s = clampN(Math.min((vw - 40) / (maxX - minX), (vh - 30) / (maxY - minY)), 0.25, 1);
      setView({ s, x: (vw - (maxX - minX) * s) / 2 - minX * s, y: 16 - minY * s });
    }, []);

    useEffect(() => {
      let t;
      (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { t = setTimeout(fit, 30); });
      const onResize = () => { clearTimeout(t); t = setTimeout(fit, 150); };
      window.addEventListener('resize', onResize);
      return () => { window.removeEventListener('resize', onResize); clearTimeout(t); };
    }, [fit]);

    const zoomAt = (factor, mx, my) => setView(v => {
      const s = clampN(v.s * factor, 0.25, 1.4);
      return { s, x: mx - (mx - v.x) * (s / v.s), y: my - (my - v.y) * (s / v.s) };
    });

    useEffect(() => {
      const vp = vpRef.current;
      const onWheel = e => {
        e.preventDefault();
        const r = vp.getBoundingClientRect();
        zoomAt(e.deltaY > 0 ? 0.92 : 1.08, e.clientX - r.left, e.clientY - r.top);
      };
      vp.addEventListener('wheel', onWheel, { passive: false });
      return () => vp.removeEventListener('wheel', onWheel);
    }, []);

    useEffect(() => {
      const move = e => {
        const d = dragRef.current;
        if (!d) return;
        if (d.kind === 'node') {
          const s = viewRef.current.s;
          dispatch({ type: 'move', idx: d.idx, x: Math.round(d.ox + (e.clientX - d.sx) / s), y: Math.round(d.oy + (e.clientY - d.sy) / s) });
        } else {
          setView(v => ({ ...v, x: d.px + e.clientX - d.sx, y: d.py + e.clientY - d.sy }));
        }
      };
      const up = () => { dragRef.current = null; setPanning(false); };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
      return () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); };
    }, [dispatch]);

    const onPointerDown = e => {
      if (e.button !== 0 || e.target.closest('.hud, .legend, button')) return;
      const node = e.target.closest('.step-node');
      if (node) {
        const idx = +node.dataset.stage;
        onSelect(idx);
        if (e.target.closest('.node-header')) {
          e.preventDefault();
          dragRef.current = { kind: 'node', idx, sx: e.clientX, sy: e.clientY, ox: state.positions[idx].x, oy: state.positions[idx].y };
        }
        return;
      }
      dragRef.current = { kind: 'pan', sx: e.clientX, sy: e.clientY, px: view.x, py: view.y };
      setPanning(true);
    };

    const center = () => { const vp = vpRef.current; return [vp.clientWidth / 2, vp.clientHeight / 2]; };

    return html`<div className=${'viewport' + (panning ? ' panning' : '')} ref=${vpRef} onPointerDown=${onPointerDown}>
      <div className="world" style=${{ transform: `translate(${view.x}px, ${view.y}px) scale(${view.s})` }}>
        <svg className="edges" aria-hidden="true">
          ${geom.edges.map((e, i) => html`<g key=${i}><path className="e-bg" d=${e.d} /><path className="e-anim" d=${e.d} /><path className="e-pulse" d=${e.d} /></g>`)}
        </svg>
        <${OverviewCard} innerRef=${bannerRef} />
        ${STEPS.map((s, si) => html`<${StepNode} key=${si} si=${si} state=${state} selected=${si === selected}
            sim=${si === simStep} onSelect=${onSelect} nodeRef=${el => (nodeRefs.current[si] = el)} />`)}
        ${geom.edges.map((e, i) => {
          const cleared = STEPS[i].items.every(it => state.status[it.row] === 2);
          return html`<div key=${'g' + i} className=${'gate' + (cleared ? ' cleared' : '')} style=${{ left: e.gx + 'px', top: e.gy + 'px' }}>
            ${cleared ? '✓' : '◆'} ${STEPS[i].gate}</div>`;
        })}
      </div>
      <div className="hud">
        <button type="button" className="hud-btn" aria-label="Zoom out" onClick=${() => zoomAt(1 / 1.15, ...center())}>−</button>
        <span>${Math.round(view.s * 100)}%</span>
        <button type="button" className="hud-btn" aria-label="Zoom in" onClick=${() => zoomAt(1.15, ...center())}>+</button>
        <button type="button" className="hud-btn" onClick=${fit}>FIT</button>
        <button type="button" className="hud-btn" onClick=${() => { dispatch({ type: 'resetLayout' }); setTimeout(fit, 30); }}>RESET LAYOUT</button>
        <span className="hud-hint" style=${{ opacity: 0.6, marginLeft: '6px' }}>Drag headers • Pan • Scroll to zoom</span>
      </div>
      <div className="legend" aria-label="Legend">
        <span className="l"><${Owner} who="client">Client<//></span>
        <span className="l"><${Owner} who="nht">Nexus Hestia<//></span>
        <span className="l"><${Owner} who="joint">Joint<//></span>
        <span className="l"><${Dot} s=${0} />Pending</span>
        <span className="l"><${Dot} s=${1} />In Progress</span>
        <span className="l"><${Dot} s=${2} />Done</span>
      </div>
    </div>`;
  }

  /* ---------- Step details (sidebar on desktop, stacked sections on compact) ---------- */
  function StepDetails({ si, state, dispatch, showHeading = true }) {
    const s = STEPS[si];
    const done = s.items.filter(it => state.status[it.row] === 2).length;
    const bmax = Math.max(...REF.buckets), wmax = Math.max(...REF.waves.map(w => w.n));
    return html`<${React.Fragment}>
      ${showHeading && html`<div>
        <div className="section-kicker">${s.tag} • ${s.horizon}</div>
        <div className="h2">${s.title}<small>${s.subtitle}</small></div>
        <p className="lead">${s.intro}</p>
      </div>`}

      ${s.buckets && html`<div className="block">
        <div className="block-title"><span>The 5 Simple Buckets</span><span className="sub">What your data is</span></div>
        ${BUCKETS.map((b, i) => html`<div className="detail" key=${i} style=${{ borderLeft: '3px solid ' + b.color }}>
          <div className="d-title">Bucket ${i + 1} — ${b.name}</div>
          <div className="d-text">${b.detail}</div>
        </div>`)}
        <p>Next, we decide what to move in first:</p>
      </div>`}

      <div className="block">
        <div className="block-title"><span>${s.checks ? 'Safety Checks' : 'What We Need'}</span><span className="sub">${done} / ${s.items.length} done</span></div>
        ${s.items.map(it => html`<div className="detail" key=${it.code}>
          <div className="row">
            <span className="item-num">${s.checks ? 'Check ' + it.code.slice(1) : 'Item ' + it.code}</span>
            <${Owner} who=${it.who}>${it.owner}<//>
          </div>
          <div className="d-title">${it.label}</div>
          <div className="d-text">${it.detail}</div>
          ${it.addon && html`<div><span className="addon">${it.addon}</span></div>`}
          <div className="row" style=${{ marginTop: '4px' }}>
            <span className="d-need">✓ Sign-off: ${SIGNOFF[it.row].need}</span>
            <${StatusBtn} row=${it.row} state=${state} dispatch=${dispatch} />
          </div>
        </div>`)}
      </div>

      ${si === 0 && html`<div className="block">
        <div className="block-title"><span>30 Years of Records — Typical Eras</span><span className="sub">Reference</span></div>
        <p className="ref-note">Each era usually needs a different rescue method. Assumed structure from the CS.BImpact register; confirm against your actual history.</p>
        ${REF.eras.map(e => html`<div className="era" key=${e[0]}><span className="mono">${e[0]}</span><span>${e[1]}</span></div>`)}
      </div>`}

      ${s.buckets && html`<div className="block">
        <div className="block-title"><span>Reference Profile</span><span className="sub">Draft register</span></div>
        <p className="ref-note">Illustrative draft from the CS.BImpact data register (proposal v1.0): ${REF.total} data streams across ${REF.departments} departments. Counts are assumptions to be confirmed at discovery.</p>
        <div className="mini">Streams per bucket</div>
        ${BUCKETS.map((b, i) => html`<div className="meter" key=${i}>
          <span>${b.name.replace(' (The Core Vault)', '')}</span>
          <div className="meter-track"><span style=${{ width: (REF.buckets[i] / bmax) * 100 + '%', background: b.color }}></span></div>
          <span className="mv">${REF.buckets[i]}</span>
        </div>`)}
        <div className="mini" style=${{ marginTop: '4px' }}>Move-in waves</div>
        ${REF.waves.map(w => html`<div className="meter" key=${w.name}>
          <span>${w.name}</span>
          <div className="meter-track"><span style=${{ width: (w.n / wmax) * 100 + '%', background: 'var(--accent-magenta)' }}></span></div>
          <span className="mv">${w.n}</span>
        </div>`)}
      </div>`}
    <//>`;
  }

  /* ---------- Intake form ---------- */
  function Field({ k, label, state, dispatch, type = 'text', ph, hint }) {
    const id = 'f-' + k;
    const onChange = e => dispatch({ type: 'field', key: k, value: e.target.value });
    return html`<div>
      <label className="label" htmlFor=${id}>${label}</label>
      ${hint && html`<span className="hint">${hint}</span>`}
      ${type === 'textarea'
        ? html`<textarea className="input" id=${id} placeholder=${ph} value=${state.form[k]} onChange=${onChange}></textarea>`
        : html`<input className="input" id=${id} type=${type} placeholder=${ph} value=${state.form[k]} onChange=${onChange} />`}
    </div>`;
  }

  function Intake({ state, dispatch, goTab }) {
    const f = state.form;
    const F = p => html`<${Field} state=${state} dispatch=${dispatch} ...${p} />`;
    return html`<${React.Fragment}>
      <div>
        <div className="section-kicker">Client Intake Form</div>
        <div className="h2">Tell Us About Your Files</div>
        <p className="lead">Fill in what you know — rough answers are fine. Everything saves automatically on this device and feeds your one-page setup summary.</p>
      </div>

      <div className="block">
        <div className="block-title"><span>Client</span></div>
        ${F({ k: 'orgName', label: 'Company / Organization Name', ph: CLIENT })}
      </div>

      <div className="block">
        <div className="block-title"><span>Step 1: Where Your Files Live</span><span className="sub">Items 1 & 1b</span></div>
        ${F({ k: 'currentStorage', label: '1. Current Digital Storage', type: 'textarea', hint: 'Cloud folders, office servers, email archives, external hard drives — and roughly how full they are.', ph: 'e.g., SharePoint (~2 TB), Outlook email archives (.pst), shared office drive, 3 external hard drives…' })}
        ${F({ k: 'legacyMedia', label: '1b. Old Paper & Outdated Media', type: 'textarea', hint: 'Filing cabinets, binders, faxes, VHS tapes, CDs, floppy disks, or old hard drives from the past 30 years.', ph: 'e.g., Paper orders & faxed confirmations (1994–2000), binders of tearsheets, VHS / cassette recordings, DVDs, drives of departed staff…' })}
        <label className="chip gold">
          <input type="checkbox" checked=${f.rescueService} onChange=${e => dispatch({ type: 'field', key: 'rescueService', value: e.target.checked })} />
          <span><strong style=${{ color: 'var(--accent-gold)' }}>Include the optional Rescue Service</strong> — our team scans, digitizes, and rescues old records so nothing is lost.</span>
        </label>
      </div>

      <div className="block">
        <div className="block-title"><span>Step 2: What Moves In First</span><span className="sub">Items 2–4</span></div>
        ${F({ k: 'alreadySaved', label: '2. What You Already Save', type: 'textarea', ph: 'e.g., Client briefs and contracts, media plans, invoices, monthly reports…' })}
        ${F({ k: 'day1Files', label: '3. Urgent Day-1 Files', type: 'textarea', hint: 'Active contracts, plans, invoices, and leadership know-how.', ph: 'e.g., Active client contracts, current campaign plans, open invoices, current rate cards…' })}
        ${F({ k: 'phase2Files', label: '4. Phase 2 Files', type: 'textarea', hint: 'Useful background files we can add once your main vault is running smoothly.', ph: 'e.g., Old chat logs, reference kits, secondary reports…' })}
      </div>

      <div className="block">
        <div className="block-title"><span>Step 3: Keys & Access</span><span className="sub">Items 5–6</span></div>
        <div className="grid-2">
          ${F({ k: 'adminName', label: '5. Vault Administrator — Name', ph: 'Full name' })}
          ${F({ k: 'adminEmail', label: 'Administrator Email', type: 'email', ph: 'name@csbi.com' })}
        </div>
        ${F({ k: 'accessRules', label: '6. Team Access & Privacy Rules', type: 'textarea', hint: 'Who on your staff (or outside partners) should see what.', ph: 'e.g., Leadership — everything; Team leads — their client files; Finance — billing; Outside partners — view-only on shared projects; Payroll, legal advice & vendor pricing locked to leadership…' })}
      </div>

      <div className="block">
        <div className="block-title"><span>Step 4: Software Connectors</span><span className="sub">Items 7–8</span></div>
        <span className="label">7. Ready-to-Use Connectors to Turn On</span>
        ${READY_CONNECTORS.map(c => html`<label className="chip" key=${c}>
          <input type="checkbox" checked=${!!f.connectors[c]} onChange=${e => dispatch({ type: 'connector', key: c, value: e.target.checked })} />
          <span>${c}</span>
        </label>`)}
        ${F({ k: 'customConnectors', label: '8. Custom Connectors Needed ASAP', type: 'textarea', hint: 'Specialized or older industry software we should build connectors for.', ph: 'e.g., Legacy buying / traffic system, older accounting software, ratings data feeds…' })}
      </div>

      <div className="block">
        <div className="block-title"><span>Step 5: 6 Quick Safety Checks</span><span className="sub">C1–C6</span></div>
        <div>
          <label className="label" htmlFor="f-transferMethod">Check 1. How We Move Large Files</label>
          <select className="input" id="f-transferMethod" value=${f.transferMethod} onChange=${e => dispatch({ type: 'field', key: 'transferMethod', value: e.target.value })}>
            ${TRANSFER_OPTIONS.map(o => html`<option key=${o} value=${o}>${o}</option>`)}
          </select>
        </div>
        ${F({ k: 'privacyRules', label: 'Check 2. Privacy & Legal Boundaries', type: 'textarea', hint: 'Personal data (PII), sensitive financial rebates, and confidential client rules.', ph: 'e.g., Lock payroll & HR files; restrict vendor rebates and deal terms; honour client contracts that limit AI use…' })}
        ${F({ k: 'duplicateRule', label: 'Check 3. Handling Duplicate Files', type: 'textarea' })}
        ${F({ k: 'softwareLogins', label: 'Check 4. Software Needing Read-Only Logins', type: 'textarea', ph: 'e.g., Email system, accounting software, cloud drives, buying platforms…' })}
        ${F({ k: 'sampleFiles', label: 'Check 5a. 5–10 Sample Test Files', type: 'textarea', ph: 'e.g., One media plan, one signed contract, one invoice, one scanned fax, one recorded call…' })}
        ${F({ k: 'keyPeople', label: 'Check 5b. 3–5 Key People to Record First', type: 'textarea', hint: 'Senior team members whose unwritten knowledge we should record first.', ph: 'e.g., Founder, longest-serving buyer, head of finance…' })}
      </div>

      <div className="block">
        <div className="block-title"><span>Check 6. Executive Sign-Off & Authorization</span></div>
        <span className="mini">Client Lead Authorization</span>
        <div className="grid-2">
          ${F({ k: 'clientLeadName', label: 'Name', ph: 'Full name' })}
          ${F({ k: 'clientLeadTitle', label: 'Title', ph: 'Title' })}
        </div>
        ${F({ k: 'clientLeadDate', label: 'Date', type: 'date' })}
        <span className="mini" style=${{ marginTop: '6px' }}>Nexus Hestia Lead Sign-Off</span>
        <div className="grid-2">
          ${F({ k: 'nhtLeadName', label: 'Name', ph: 'Full name' })}
          ${F({ k: 'nhtLeadTitle', label: 'Title', ph: 'Title' })}
        </div>
        ${F({ k: 'nhtLeadDate', label: 'Date', type: 'date' })}
        <p className="ref-note">Signatures are added on the printed summary (Export → Print / PDF).</p>
      </div>

      <div className="btns"><button type="button" className="btn primary" onClick=${() => goTab('signoff')}>Review Sign-Off Checklist →</button></div>
    <//>`;
  }

  /* ---------- Master sign-off checklist ---------- */
  function SignOff({ state, dispatch, goTab }) {
    const done = doneCount(state.status), prog = state.status.filter(s => s === 1).length;
    const groups = [[0, 9, 'The 8 Steps (Items 1–8)'], [9, 15, 'The 6 Safety Checks']];
    return html`<${React.Fragment}>
      <div>
        <div className="section-kicker">Master Sign-Off Checklist</div>
        <div className="h2">15 Simple Steps</div>
        <p className="lead">Tap a status to move it from Pending → In Progress → Done.</p>
      </div>
      <div className="stats">
        <div className="stat done"><div className="v">${done}</div><div className="k">Done</div></div>
        <div className="stat prog"><div className="v">${prog}</div><div className="k">In Progress</div></div>
        <div className="stat"><div className="v">${15 - done - prog}</div><div className="k">Pending</div></div>
      </div>
      <div className="block" style=${{ gap: 0 }}>
        ${groups.map(([a, b, label]) => html`<${React.Fragment} key=${label}>
          <div className="so-group">${label}</div>
          ${SIGNOFF.slice(a, b).map((r, k) => { const i = a + k; return html`
            <div className=${'so-row s' + state.status[i]} key=${i}>
              <span className="so-step">${r.step}</span>
              <span className="so-need"><span>${r.need}</span><${Owner} who=${whoClass(r.who)}>${r.who}<//></span>
              <${StatusBtn} row=${i} state=${state} dispatch=${dispatch} />
            </div>`; })}
        <//>`)}
      </div>
      <div className="btns"><button type="button" className="btn primary" onClick=${() => goTab('export')}>Export Setup Summary →</button></div>
    <//>`;
  }

  /* ---------- Export ---------- */
  function ExportPanel({ state, dispatch, toast }) {
    const md = useMemo(() => briefMarkdown(state), [state]);
    const json = useMemo(() => JSON.stringify(exportObject(state), null, 2), [state]);
    return html`<${React.Fragment}>
      <div>
        <div className="section-kicker">Check 6 // One-Page Setup Summary</div>
        <div className="h2">Export & Sign Off</div>
        <p className="lead">Copy the summary, download it as JSON, or print it to PDF with signature lines for both leads.</p>
      </div>
      <div className="btns">
        <button type="button" className="btn primary solid" onClick=${() => window.print()}>Print / PDF</button>
        <button type="button" className="btn" onClick=${() => copyText(md, () => toast('Summary copied'))}>Copy Summary</button>
        <button type="button" className="btn" onClick=${() => downloadJSON(state)}>Download JSON</button>
      </div>
      <div className="block">
        <div className="block-title"><span>Setup Summary (Markdown)</span><span className="sub">${doneCount(state.status)} / 15 done</span></div>
        <pre className="out">${md}</pre>
      </div>
      <div className="block">
        <div className="block-title"><span>Machine-Readable (JSON)</span>
          <button type="button" className="btn small" onClick=${() => copyText(json, () => toast('JSON copied'))}>Copy JSON</button></div>
        <pre className="out" style=${{ color: 'var(--text-primary)' }}>${json}</pre>
      </div>
      <div className="block">
        <div className="block-title"><span>Start Over</span></div>
        <p>Clears all answers and statuses saved on this device.</p>
        <button type="button" className="btn danger" onClick=${() => {
          if (confirm('Clear all answers and sign-off statuses saved on this device?')) { dispatch({ type: 'resetAll' }); toast('All answers cleared'); }
        }}>Reset All Answers</button>
      </div>
    <//>`;
  }

  /* ---------- Print sheet (always rendered, shown only when printing) ---------- */
  function PrintSheet({ state }) {
    const f = state.form, conns = READY_CONNECTORS.filter(c => f.connectors[c]);
    const R = (k, v) => html`<${React.Fragment} key=${k}><dt>${k}</dt><dd>${v}</dd><//>`;
    const Sig = (title, n, t, d) => html`<div><strong>${title}</strong>
      <p>Signature: ____________________________</p>
      <p>Name: ${or(n, '____________________________')}</p>
      <p>Title: ${or(t, '____________________________')}</p>
      <p>Date: ${or(d, '____________________________')}</p></div>`;
    return html`<div className="print-sheet" aria-hidden="true">
      <div className="p-head">
        <img src=${LOGO} alt="" />
        <div>
          <div className="p-word">NEXUS <span>HESTIA</span></div>
          <div className="p-sub">${'TECHNOLOGIES INC'.split('').map((c, i) => html`<span key=${i}>${c === ' ' ? ' ' : c}</span>`)}</div>
        </div>
        <div style=${{ marginLeft: 'auto', textAlign: 'right' }}>
          <h1>Guide to Getting Started</h1>
          <div className="p-meta">One-Page Setup Summary · ${clientName(f)}</div>
          <div className="p-meta">Sign-off progress: ${doneCount(state.status)} / 15 · Printed ${new Date().toLocaleDateString()}</div>
        </div>
      </div>
      <h2>Step 1 · Where Your Files Live</h2>
      <dl>${R('1. Current Digital Storage', or(f.currentStorage, '—'))}${R('1b. Old Paper & Outdated Media', or(f.legacyMedia, '—'))}${R('Optional Rescue Service', f.rescueService ? 'Included' : 'Not required')}</dl>
      <h2>Step 2 · 5 Simple Buckets & What Moves In First</h2>
      <dl>${R('2. What You Already Save', or(f.alreadySaved, '—'))}${R('3. Urgent Day-1 Files', or(f.day1Files, '—'))}${R('4. Phase 2 Files', or(f.phase2Files, '—'))}</dl>
      <h2>Step 3 · Keys & Access</h2>
      <dl>${R('5. Vault Administrator', or(f.adminName, '—') + (f.adminEmail ? ' · ' + f.adminEmail : ''))}${R('6. Team Access & Privacy Rules', or(f.accessRules, '—'))}</dl>
      <h2>Step 4 · Software Connectors</h2>
      <dl>${R('7. Ready-to-Use Connectors', conns.join(', ') || '—')}${R('8. Custom Connectors ASAP', or(f.customConnectors, '—'))}</dl>
      <h2>Step 5 · 6 Quick Safety Checks</h2>
      <dl>${R('1. Moving Large Files', f.transferMethod)}${R('2. Privacy & Legal Boundaries', or(f.privacyRules, '—'))}${R('3. Duplicate Files', or(f.duplicateRule, '—'))}${R('4. Read-Only Logins', or(f.softwareLogins, '—'))}${R('5. Sample Files', or(f.sampleFiles, '—'))}${R('5. Key People', or(f.keyPeople, '—'))}</dl>
      <h2>Master Sign-Off Checklist (15 Simple Steps)</h2>
      <table>
        <thead><tr><th>Step</th><th>What We Need</th><th>Who Handles It</th><th>Status</th></tr></thead>
        <tbody>${SIGNOFF.map((r, i) => html`<tr key=${i}><td>${r.step}</td><td>${r.need}</td><td>${r.who}</td><td>${STATUS_LABELS[state.status[i]]}</td></tr>`)}</tbody>
      </table>
      <h2>Executive Sign-Off & Authorization</h2>
      <div className="sig">
        ${Sig('Client Lead Authorization', f.clientLeadName, f.clientLeadTitle, f.clientLeadDate)}
        ${Sig('Nexus Hestia Lead Sign-Off', f.nhtLeadName, f.nhtLeadTitle, f.nhtLeadDate)}
      </div>
      <div className="p-foot"><img src=${LOGO} alt="" /><span>Nexus Hestia Technologies Inc · Sovereign AI Data Infrastructure & Spatial Analytics · Confidential</span></div>
    </div>`;
  }

  /* ---------- Tabs ---------- */
  function Tabs({ tab, setTab, compact }) {
    const list = [['details', compact ? 'Steps' : 'Step Details'], ['worksheet', 'Intake'], ['signoff', 'Sign-Off'], ['export', 'Export']];
    return html`<div className=${'tabs' + (compact ? ' compact-tabs' : '')} role="tablist">
      ${list.map(([k, label]) => html`<button key=${k} type="button" role="tab" aria-selected=${tab === k}
        className=${'tab' + (tab === k ? ' active' : '')} onClick=${() => setTab(k)}>${label}</button>`)}
    </div>`;
  }

  /* ---------- App ---------- */
  function App() {
    const [state, dispatch] = useReducer(reducer, null, loadState);
    const [selected, setSelected] = useState(0);
    const [tab, setTabRaw] = useState('details');
    const [simOn, setSimOn] = useState(false);
    const [simStep, setSimStep] = useState(-1);
    const [toastMsg, setToastMsg] = useState('');
    const compact = useMedia('(max-width: 1100px)');
    const panelRef = useRef(null);
    const toastTimer = useRef(null);

    useEffect(() => { document.documentElement.setAttribute('data-theme', state.theme); }, [state.theme]);
    useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ } }, [state]);

    const toast = useCallback(msg => {
      setToastMsg(msg);
      clearTimeout(toastTimer.current);
      toastTimer.current = setTimeout(() => setToastMsg(''), 1800);
    }, []);

    const setTab = useCallback(t => {
      setTabRaw(t);
      if (panelRef.current) panelRef.current.scrollTop = 0;
      if (compact) window.scrollTo({ top: Math.min(window.scrollY, document.querySelector('.compact-tabs')?.offsetTop || 0) });
    }, [compact]);

    const onSelect = useCallback(i => {
      setSelected(i);
      setTabRaw('details');
      if (panelRef.current) panelRef.current.scrollTop = 0;
    }, []);

    useEffect(() => {
      if (!simOn) { setSimStep(-1); return; }
      let i = 0;
      const run = () => { setSimStep(i); onSelect(i); i = (i + 1) % STEPS.length; };
      run();
      const t = setInterval(run, 3200);
      return () => clearInterval(t);
    }, [simOn, onSelect]);

    useEffect(() => {
      if (compact && simStep >= 0) {
        const el = document.getElementById('sec-' + simStep);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }, [compact, simStep]);

    const panelFor = () => {
      if (tab === 'worksheet') return html`<${Intake} state=${state} dispatch=${dispatch} goTab=${setTab} />`;
      if (tab === 'signoff') return html`<${SignOff} state=${state} dispatch=${dispatch} goTab=${setTab} />`;
      if (tab === 'export') return html`<${ExportPanel} state=${state} dispatch=${dispatch} toast=${toast} />`;
      return null;
    };

    const desktopDetails = html`<${React.Fragment}>
      <${StepDetails} si=${selected} state=${state} dispatch=${dispatch} />
      <div className="btns">
        ${selected > 0 && html`<button type="button" className="btn" onClick=${() => onSelect(selected - 1)}>← Step ${selected}</button>`}
        <button type="button" className="btn primary" onClick=${() => setTab('worksheet')}>Fill In Intake Form</button>
        ${selected < 4 && html`<button type="button" className="btn" onClick=${() => onSelect(selected + 1)}>Step ${selected + 2} →</button>`}
      </div>
    <//>`;

    const compactSteps = html`<${React.Fragment}>
      <${OverviewCard} />
      ${STEPS.map((s, si) => {
        const done = s.items.filter(it => state.status[it.row] === 2).length;
        const cleared = done === s.items.length;
        return html`<${React.Fragment} key=${si}>
          <section id=${'sec-' + si} className=${'step-section' + (simStep === si ? ' sim' : '')}>
            <div className="sec-head">
              <span className=${'tag ' + s.tagClass}>${s.tag}</span>
              <span className="mini">${done} / ${s.items.length} done</span>
            </div>
            <div className="panel"><${StepDetails} si=${si} state=${state} dispatch=${dispatch} /></div>
          </section>
          ${si < 4 && html`<div className="gate-link"><span className=${'gate' + (cleared ? ' cleared' : '')}>${cleared ? '✓' : '◆'} ${s.gate}</span></div>`}
        <//>`;
      })}
      <div className="btns"><button type="button" className="btn primary" onClick=${() => setTab('worksheet')}>Fill In Intake Form →</button></div>
    <//>`;

    return html`<div className=${'app ' + (compact ? 'compact' : 'desktop')}>
      <${Header} state=${state} dispatch=${dispatch} simOn=${simOn} setSimOn=${setSimOn} />

      ${compact
        ? html`<${React.Fragment}>
            <${Tabs} tab=${tab} setTab=${setTab} compact=${true} />
            <main className="compact-main panel">${tab === 'details' ? compactSteps : panelFor()}</main>
          <//>`
        : html`<div className="workspace">
            <${Canvas} state=${state} dispatch=${dispatch} selected=${selected} onSelect=${onSelect} simStep=${simStep} />
            <aside className="sidebar">
              <${Tabs} tab=${tab} setTab=${setTab} compact=${false} />
              <div className="panel" ref=${panelRef}>${tab === 'details' ? desktopDetails : panelFor()}</div>
            </aside>
          </div>`}

      <footer>
        <img className="logo-sm" src=${LOGO} alt="" />
        <span className="f-brand">Nexus Hestia Technologies Inc</span>
        <span className="f-sep">|</span>
        <span className="f-tag">Sovereign AI Data Infrastructure & Spatial Analytics</span>
        <span className="f-sep">|</span>
        <span className="f-tag">Your vault, your data — 100% client-owned</span>
        <span className="f-right">${clientName(state.form)} · Confidential</span>
      </footer>

      <div className=${'toast' + (toastMsg ? ' show' : '')} role="status" aria-live="polite">${toastMsg}</div>
      <${PrintSheet} state=${state} />
    </div>`;
  }

  ReactDOM.createRoot(root).render(html`<${App} />`);
})();
</script>
</body>
</html>
